<mat-card class="login-form">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2 class="form-title">Login</h2>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>email</mat-icon>
      <input matInput id="email" type="email" formControlName="email">
      <mat-error>Email is required and must be valid.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Password</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input matInput id="password" type="password" formControlName="password">
      <mat-error>Password is required.</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
      <mat-icon>login</mat-icon>
      Login
    </button>

    <p class="switch-auth">
      Don’t have an account?
      <a routerLink="/register">Register here</a>
    </p>
  </form>
</mat-card>
