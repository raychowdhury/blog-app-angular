

<app-navbar></app-navbar>

<div class="blog-details" *ngIf="blog$ | async as blog; else loading">
  <h2 class="blog-title">{{ blog.title }}</h2>
  <p class="blog-meta">
    ✍️ {{ blog.author }} | 📅 {{ blog.publishDate | date:'mediumDate' }}
  </p>
  <p class="blog-content">{{ blog.content }}</p>
  <div class="back-button">
  <button routerLink="/blogs">⬅️ Back to Blogs</button>
</div>
</div>

<ng-template #loading>
  <p>Loading blog...</p>
</ng-template>
