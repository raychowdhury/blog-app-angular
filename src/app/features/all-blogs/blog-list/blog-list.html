<app-navbar></app-navbar>
<div class="blog-list">
  <div class="blog-cards">
    @for (blog of pagedBlogs; track blog.id) {
      <mat-card class="blog-card" [routerLink]="['/blogs', blog.id]" appearance="outlined">
        <mat-card-header>
          <mat-card-title class="blog-title">{{ blog.title }}</mat-card-title>
          <mat-card-subtitle class="blog-meta">
            <mat-icon inline>person</mat-icon>
            {{ blog.author }}
            &nbsp; • &nbsp;
            <mat-icon inline>event</mat-icon>
            {{ blog.publishDate | date: 'mediumDate' }}
          </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p class="blog-excerpt">{{ blog.excerpt }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-button color="primary">Read more</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
  <mat-paginator
    [length]="blogs.length"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[6, 12, 24]"
    (page)="onPageChange($event)"
  />
</div>
